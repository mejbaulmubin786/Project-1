<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furniro</title>
  <link rel="stylesheet" href="./css/all.min.css" />
  <link rel="stylesheet" href="./css/general.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <!-- ========================================================================
                               NAV-BAR SECTION
=========================================================================== -->
  <nav class="main-navbar">
    <div class="container">
      <div class="nav-content flex justify-between align-center">
        <!-- Logo -->
        <div class="logo">
          <a href="#">
            <img src="./images/logo.png" alt="Logo" />
          </a>
        </div>

        <!-- Hamburger Icon (visible only on mobile) -->
        <button class="menu-toggle" aria-label="Toggle Menu">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>

        <!-- Main Menu -->
        <ul class="main-menu flex justify-center align-center">
          <li><a href="#">Home</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>

        <!-- Icons -->
        <ul class="icons flex justify-center align-center">
          <li><a href="#"><i class="fa-light fa-user"></i></a></li>
          <li><a href="#"><i class="fa-regular fa-magnifying-glass"></i></a></li>
          <li><a href="#"><i class="fa-light fa-heart"></i></a></li>
          <li><a href="#"><i class="fa-regular fa-cart-shopping"></i></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ========================================================================
                               BANNER SECTION
=========================================================================== -->
  <section class="hero-banner">
    <div class="container">
      <div class="hero-content-wrapper flex justify-end">
        <div class="hero-text-block">
          <h4 class="hero-subtitle text-semibold">New Arrival</h4>
          <h1 class="hero-title">
            <span>Discover Our</span>
            <span> New Collection</span>
          </h1>
          <p class="hero-description text-medium">
            <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut</span>
            elit tellus, luctus nec ullamcorper mattis.
          </p>

          <div class="hero-cta">
            <a href="#" class="btn-primary text-bold">
              <span>BUY NOW</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>


  <!-- ========================================================================
                                BROWSE SECTION
=========================================================================== -->
  <section class="section-browse">
    <div class="container">
      <div class="browse">
        <header class="browse__header text-center">
          <h2 class="browse__title">Browse The Range</h2>
          <p class="browse__subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </header>
        <div class="browse__gallery flex">
          <div class="gallery__item text-center">
            <div class="gallery__image-wrapper">
              <img src="./images/gallery/dining.png" alt="Dining" class="gallery__image" />
            </div>
            <h3 class="gallery__label fw-semibold">Dining</h3>
          </div>
          <div class="gallery__item text-center">
            <div class="gallery__image-wrapper">
              <img src="./images/gallery/living.png" alt="Living" class="gallery__image" />
            </div>
            <h3 class="gallery__label fw-semibold">Living</h3>
          </div>
          <div class="gallery__item text-center">
            <div class="gallery__image-wrapper">
              <img src="./images/gallery/bedroom.png" alt="Bedroom" class="gallery__image" />
            </div>
            <h3 class="gallery__label fw-semibold">Bedroom</h3>
          </div>
        </div>
      </div>
    </div>
  </section>

 
  <!-- ========================================================================
                                PRODUCTS SECTION
=========================================================================== -->
  <section class="section-products">
    <div class="container">
      <div class="product-gallery">
      </div>
    </div>
  </section>
  <!-- ========================================================================
                                CAROUSEL SECTION
=========================================================================== -->

  <!-- ========================================================================
                                FURNITURE-GALLERY SECTION
=========================================================================== -->

  <!-- ========================================================================
                                FOOTER SECTION
=========================================================================== -->



  <script src="./js/script.js"></script>
</body>

</html>
